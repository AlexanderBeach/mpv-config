##### Video / HDR #####
vo=gpu-next
hwdec=auto-safe               # use the GPU's video decoder where it's known to work; falls back to the CPU otherwise
target-colorspace-hint=yes    # tell the display the video's color space, so HDR plays as HDR on HDR displays
dither-depth=auto
# gpu-api is left on auto (Direct3D 11 on Windows). Add gpu-api=vulkan to use Vulkan instead.

##### Motion #####
video-sync=display-resample   # smooth, consistent playback (removes vsync clock-drift stutter)
interpolation=no              # no motion interpolation (set yes for smoother motion, at some GPU cost)

##### Picture quality ("high" preset; see the presets at the end of this file) #####
deband=no                     # keeps the picture untouched; right-click > Video > Deband smooths banding when a video has it
scale-antiring=0.6
cscale-antiring=0.6
hdr-compute-peak=no           # HDR on SDR displays: use the video's metadata instead of measuring each frame
# The best (and slowest) scalers are off and toggled with F1 (see input.conf); the "ultra" preset turns them on.

##### Audio #####
volume-max=150
# ---- Surround passthrough (Dolby / DTS bitstream) to an AV receiver or soundbar: uncomment to use ----
# (ao and audio-exclusive are for Windows; leave them out on other systems)
#ao=wasapi
#audio-exclusive=yes
#audio-channels=7.1,5.1,stereo
#audio-spdif=ac3,eac3,dts,dts-hd,truehd

##### Languages #####
# Language codes in order of preference, e.g. eng,en  jpn,ja  deu,de  fra,fr  spa,es
#alang=                           # audio languages (none: the file's default track, usually the original)
slang=eng,en                      # subtitle languages
subs-with-matching-audio=forced   # when the audio is already in a subtitle language, show only forced subtitles

##### Subtitles #####
sub-auto=fuzzy
sub-file-paths-append=subs        # also look for external subtitles in these subfolders
sub-file-paths-append=Subs
sub-file-paths-append=subtitles
embeddedfonts=yes
demuxer-mkv-subtitle-preroll=yes   # subtitles show immediately after seeking in MKVs
# Subtitle font: the first of these that is installed is used, otherwise the system's default font
# (chosen by scripts/font-fallback.lua; fonts in the fonts folder count as installed). A font can
# have its own size and weight in brackets; the others use sub-font-size and sub-bold below.
sub-font=FiraGO Book (37 regular), Segoe UI Semilight, Erewhon
sub-font-size=42
sub-bold=yes
sub-color="#FFFFFFFF"          # text color (white)
sub-outline-size=2             # outline thickness (0 removes it)
sub-outline-color="#FF000000"  # outline color (black)
sub-shadow-offset=0            # drop-shadow distance (0 = none)
sub-pos=100                    # 100 = bottom; lower numbers move it up
sub-use-margins=no
sub-ass-force-margins=no

# Apply all of the above to ASS/SSA subtitles too (leave commented to keep their original style;
# the subtitle style panel has a switch for this):
#sub-ass-override=force

##### Cache (smoother seeking in large files) #####
cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=256MiB
demuxer-readahead-secs=20

##### Quality-of-life #####
autocreate-playlist=same           # opening one file queues the rest of the folder (same kind: video/audio/images)
save-position-on-quit=no           # resuming is handled by scripts/resume-prompt.lua instead
watch-later-options=start          # resume position only (not per-file volume/speed/etc.)
keep-open=yes
autofit-larger=90%x90%
cursor-autohide=1000
snap-window=yes                    # window snaps to screen edges when dragged near them (Windows)

##### Screenshots #####
screenshot-format=png
screenshot-template="%F - %P"      # e.g. "Movie - 01_23_45.678.png"

##### On-screen controls come from ModernZ (scripts/modernz.lua) #####
osc=no
osd-bar=no
#border=no                    # uncomment for a borderless window

##### HDR vs SDR auto-profile (tone-mapping only applies when the display isn't in HDR mode) #####
[hdr]
profile-cond=p["video-params/gamma"]=="pq" or p["video-params/gamma"]=="hlg" or p["video-params/primaries"]=="bt.2020"
profile-restore=copy
tone-mapping=spline

##### Quality presets: pick one on the last line of this file #####
# High and Light add nothing that changes the look of the video. Ultra renders more precisely and
# adds debanding, motion smoothing and HDR peak detection, for the smoothest picture.
[high]
profile-desc=High quality: the settings at the top of this file (default)

[ultra]
profile-desc=Ultra quality: the most accurate rendering, plus debanding, motion smoothing and HDR peak detection (needs a strong GPU)
scale=ewa_lanczossharp        # the best (and slowest) scalers, as F1 turns on
cscale=ewa_lanczossharp
dscale=mitchell
dither=error-diffusion        # finer dithering than the default pattern
deband=yes                    # removes banding in skies, gradients and dark scenes
interpolation=yes             # smooths judder by blending frames to the display's refresh rate
tscale=oversample
hdr-compute-peak=yes          # HDR on SDR displays: measures each scene's brightness for the tone mapping

[light]
profile-desc=Light: the fastest settings, for older PCs and laptops on battery
profile=fast

[default]
profile=high                  # ultra, high or light
