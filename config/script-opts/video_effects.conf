# Options for the video-effects script (scripts/video-effects). These are the defaults.

# Panel width in pixels, and its scale when windowed / fullscreen
panel_width=380
scale=1.0
scale_fullscreen=1.0

# Space kept free for ModernZ: its bottom bar, and its window-controls bar in fullscreen
bottom_margin=104
top_margin=50

# Accent color (matches the ModernZ seekbar)
accent=#3584E4

# Font; empty uses mpv's OSD font, like mpv's own menus
font=

# Live histogram: seconds between updates while playing, and decoding for the frame grabs
histogram_interval=2.0
histogram_hwdec=auto-copy

# The histogram runs a second, hidden mpv. "mpv" finds the same mpv (on macOS it is looked up
# automatically); set the full path only if the histogram says it has no picture to show.
mpv_path=mpv
