layout=default
loop_button=no
ontop_button=no
speed_button=no
icon_theme=fluent
icon_style=filled
scalewindowed=1.0
scalefullscreen=1.0
vidscale=no
# seekbar_height=small
seekbarfg_color=#357CDA
# Seek handle: a darker shade of the bar's blue (hvb's #357CDA), ringed in the bar color
seek_handle_color=#1F5AA6
seek_handle_border_color=#357CDA
# Hovered buttons (icon, glow and box) in the same blue instead of the default orange
hover_effect_color=#357CDA
volumebar_match_seek_color=yes
# Subtitles move or not
sub_margins=no
dynamic_margins=no
