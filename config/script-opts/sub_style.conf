# Options for the subtitle style panel (scripts/sub-style.lua). These are the defaults.

# Panel width in pixels, and its scale when windowed / fullscreen
panel_width=380
scale=1.0
scale_fullscreen=1.0

# Space kept free for ModernZ: its bottom bar, and its window-controls bar in fullscreen
bottom_margin=104
top_margin=50

# Accent color (matches the ModernZ seekbar)
accent=#3584E4

# Font; empty uses mpv's OSD font, like mpv's own menus
font=

# While the panel is open, show a sample line on videos without subtitles
sample=yes
