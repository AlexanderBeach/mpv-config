# Options for scripts/updater.lua (Windows builds only). These are the defaults.

# Check for a newer build in the background, at most this often
check=yes
interval_hours=24

# GitHub repository publishing the builds (shinchiro/mpv-winbuild-cmake also works)
repo=zhongfly/mpv-winbuild

# Build flavour: x86_64, x86_64-v3 (CPUs with AVX2) or aarch64; empty matches this PC
variant=
