# Seekbar thumbnails (scripts/thumbfast.lua). thumbfast finds mpv by itself; set mpv_path only if it can't.
# Decode thumbnails on the GPU (much faster on large 4K/HEVC files)
hwdec=yes
# Start the thumbnailer when a file opens so the first hover isn't blank
spawn_first=yes
max_height=250
max_width=250
