# ---- Play / pause ----
SPACE       cycle pause
k           cycle pause

# ---- Seek (YouTube: J/L = 10s, arrows = 5s) ----
l           seek  10
j           seek -10
RIGHT       seek  5
LEFT        seek -5

# ---- Jump to percentage ----
0 seek 0 absolute-percent
1 seek 10 absolute-percent
2 seek 20 absolute-percent
3 seek 30 absolute-percent
4 seek 40 absolute-percent
5 seek 50 absolute-percent
6 seek 60 absolute-percent
7 seek 70 absolute-percent
8 seek 80 absolute-percent
9 seek 90 absolute-percent

# ---- Frame step (when paused) ----
.           frame-step
,           frame-back-step

# ---- Speed (YouTube: < and >) ----
>           add speed  0.25
<           add speed -0.25
BS          set speed 1.0

# ---- Volume / mute ----
UP          no-osd add volume  5 ; show-text "Volume: ${volume}%"
DOWN        no-osd add volume -5 ; show-text "Volume: ${volume}%"
m           cycle mute

# ---- Display ----
f           cycle fullscreen
ESC         set fullscreen no
c           cycle sub-visibility

# ---- High-quality scaling toggle (OFF by default; press F1) ----
# Toggles between high-quality scalers and mpv's own defaults (lanczos / same-as-scale / hermite).
F1 cycle-values scale ewa_lanczossharp lanczos ; cycle-values cscale ewa_lanczossharp "" ; cycle-values dscale mitchell hermite ; show-text "High-quality scaling: ${?scale==ewa_lanczossharp:on}${!scale==ewa_lanczossharp:off}"
